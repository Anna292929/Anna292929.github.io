<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Object Properties</title>
</head>
<body>

  <h2>JavaScript Object Properties</h2>

  <script>
    var Person = {
      firstName: "Tony",
      lastName: "Lee",
      age: 50,
      eyeColor: "Blue"
    };

    // List all properties of the object
    document.write("Properties of Person object:<br>");

    for (var property in Person) {
      document.write(property + ": " + Person[property] + "<br>");
    }

    // Delete the age property
    delete Person.age;

    document.write("<br>After deleting age property:<br>");

    // Print the object after deleting age
    for (var property in Person) {
      document.write(property + ": " + Person[property] + "<br>");
    }

    // Also print in console
    console.log("After deleting age:", Person);
  </script>

</body>
</html>
