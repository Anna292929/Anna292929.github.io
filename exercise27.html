<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Responsive Layout</title>

<style>
body {
  margin: 0;
  background: linear-gradient(to right, #4aa3d8, #5fb3e6);
  font-family: Arial;
}

/* 外框 */
.container {
  width: 90%;
  margin: 30px auto;
  background: #eee;
  border-radius: 25px;
  padding: 20px;
  box-sizing: border-box;
}

/* 區塊 */
.box {
  border-radius: 15px;
  margin: 10px;
}

/* 綠色 */
.header {
  background: #a8cf45;
  height: 120px;
}

/* 藍色 */
.middle {
  display: flex;
}

.middle .box {
  background: #1fb5c1;
  flex: 1;
  height: 150px;
}

/* 灰色 */
.bottom {
  display: flex;
}

.bottom .box {
  background: #ccc;
  flex: 1;
  height: 100px;
}

/* 📱 手機版 */
@media (max-width: 480px) {

  .middle {
    flex-direction: column;
  }

  .bottom {
    flex-direction: column;
  }

  /* ⭐ 重點：手機時增加高度 */
  .middle .box {
    height: 120px;
  }

  .bottom .box {
    height: 80px;
  }
}
</style>

</head>

<body>

<div class="container">

  <div class="box header"></div>

  <div class="middle">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </div>

  <div class="bottom">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </div>

</div>

</body>
</html>
