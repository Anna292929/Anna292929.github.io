<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Layout</title>

<style>
body {
  margin: 0;
  background: linear-gradient(to right, #4aa3d8, #5fb3e6);
  font-family: Arial, sans-serif;
}

.container {
  width: 90%;
  margin: 20px auto;
  background: #eeeeee;
  border-radius: 25px;
  padding: 15px;
  box-sizing: border-box;
}

.box {
  border-radius: 10px;
  margin: 5px;
  box-sizing: border-box;
}

.header {
  background: #a8cf45;
  height: 120px;
}

.middle {
  display: flex;
}

.middle .box {
  background: #1fb5c1;
  flex: 1;
  height: 120px;
}

.bottom {
  display: flex;
}

.bottom .box {
  background: #cfd4d8;
  flex: 1;
  height: 60px;
}

/* 手機版 */
@media (max-width: 480px) {
  .middle {
    flex-direction: column;
  }

  .middle .box {
    height: 55px;
  }

  .bottom {
    flex-wrap: wrap;
  }

  .bottom .box {
    width: calc(50% - 10px);
    flex: none;
    height: 45px;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="box header"></div>

  <div class="middle">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </div>

  <div class="bottom">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </div>
</div>

</body>
</html>
