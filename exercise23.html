<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Button Demo</title>

<style>
body {
  font-family: "Roboto", Arial;
  background-color: #f5f5f5;
  display: flex;
  justify-content: center;
  margin-top: 50px;
}

.container {
  width: 520px;
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.image-box img {
  width: 100%;
  border-radius: 6px;
}

.btn {
  margin-top: 10px;
  height: 22px;
  padding: 0 12px;
  border: 1px solid #dcdcdc;
  border-radius: 8px;
  background-color: #ffffff;
  font-size: 13px;
  color: #2f2f2f;
  cursor: pointer;
}

.btn:hover {
  background-color: #f2f2f2;
}

.detail {
  margin-top: 15px;
  font-size: 13px;
  color: #707070;
  display: none;
  line-height: 1.6;
  border-top: 1px solid #eee;
  padding-top: 10px;
}

/* 授權文字 */
.credit {
  font-size: 11px;
  color: #999;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="container">

  <!-- 圖片 -->
  <div class="image-box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a8/Tour_Eiffel_Wikimedia_Commons.jpg" alt="Eiffel Tower">
    
    <div class="credit">
      Photo by CrisNYCa (CC BY-SA 4.0)
    </div>
  </div>

  <!-- 按鈕 -->
  <button class="btn" onclick="toggleDetail()">查看更多</button>

  <!-- 詳細資訊 -->
  <div class="detail" id="detailBox">
    Date：2017/01/12 <br>
    Type：JPG <br>
    Size：3648 x 5472 <br>
    Source：
    <a href="https://zh.wikipedia.org/zh-tw/%E8%89%BE%E8%8F%B2%E7%88%BE%E9%90%B5%E5%A1%94" target="_blank">
      維基百科
    </a>
  </div>

</div>

<script>
function toggleDetail() {
  const detail = document.getElementById("detailBox");

  if (detail.style.display === "none" || detail.style.display === "") {
    detail.style.display = "block";
  } else {
    detail.style.display = "none";
  }
}
</script>

</body>
</html>
