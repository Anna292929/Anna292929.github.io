<!DOCTYPE html>
<html>
<head>
  <title>Circle Functions</title>
</head>

<body>

  <h2>Circle Properties Calculator</h2>

  <p>Please enter the radius of a circle:</p>

  <input type="number" id="radiusInput" placeholder="Enter radius">
  <button onclick="calculateCircle()">Calculate</button>

  <h3>Result:</h3>
  <p id="circumferenceResult"></p>
  <p id="areaResult"></p>

  <script>
    function calcCircumference(radius) {
      let circumference = 2 * Math.PI * radius;
      document.getElementById("circumferenceResult").innerHTML =
        "The circumference is " + circumference.toFixed(2) + ".";
    }

    function calcArea(radius) {
      let area = Math.PI * radius * radius;
      document.getElementById("areaResult").innerHTML =
        "The area is " + area.toFixed(2) + ".";
    }

    function calculateCircle() {
      let radius = document.getElementById("radiusInput").value;

      radius = Number(radius);

      calcCircumference(radius);
      calcArea(radius);
    }
  </script>

</body>
</html>
